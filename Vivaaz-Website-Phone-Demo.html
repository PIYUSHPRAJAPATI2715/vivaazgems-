/* Layout: a real e-commerce shell (top bar, sticky header, page, footer) on warm off-white; stones are the only colour. Single light look on purpose: it is the brand's own site. */
:root{
  --bg:#FAF7F2; --paper:#FFFFFF; --ink:#1C1A17; --mute:#76706A; --soft:#9A9186; --line:#E8E1D6; --line2:#DDD3C5;
  --gold:#9B7C4E; --gold2:#B8955F; --sand:#F1EBE1; --ok:#3E7B4F; --warn:#C2412D;
  --display:'Playfair Display',Georgia,'Times New Roman',serif; --body:'Manrope','Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.i{width:18px;height:18px;flex:none}
.cap{font-size:10.5px;letter-spacing:.2em;color:var(--gold);font-weight:700;text-transform:uppercase}
.h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,4vw,48px);line-height:1.1;margin:8px 0 12px;text-wrap:balance}
.h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,2.6vw,32px);line-height:1.2;margin:6px 0 0;text-wrap:balance}
.lead{color:var(--mute);font-size:15px;max-width:62ch;margin:0}
.link{color:var(--gold);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);padding:14px 26px;font-size:12px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;border:1px solid var(--ink);transition:background .2s}
.btn:hover{background:#3a352f}
.btn.o{background:transparent;color:var(--ink)}.btn.o:hover{background:var(--ink);color:var(--paper)}
.btn.sm{padding:10px 16px;font-size:11px}
.btn.wide{width:100%}
.btn.wa{background:#1E9E52;border-color:#1E9E52;color:#fff}.btn.wa:hover{background:#178544}
.ul{font-size:11.5px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-size:12.5px;background:var(--paper);color:#3b362f;transition:all .15s;white-space:nowrap}
.chip em{font-style:normal;color:var(--soft);font-size:11.5px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.chip.on em{color:#cfc6b8}
.chip.lg{padding:9px 18px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:11px;height:11px;border-radius:50%;border:1px solid var(--line2)}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}
.rv{animation:rise .6s ease both}
.rv:nth-child(2){animation-delay:.06s}.rv:nth-child(3){animation-delay:.12s}.rv:nth-child(4){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar + header */
.tb{background:var(--ink);color:#F3EEE6;font-size:11px;letter-spacing:.14em}
.tb .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:16px}
.tb .r{display:flex;gap:22px;align-items:center}
.tb a:hover{color:var(--gold2)}
.cur{position:relative}
.cur>button{font-weight:700;letter-spacing:.1em;color:#fff}
.curm{position:absolute;right:0;top:26px;background:var(--paper);color:var(--ink);border:1px solid var(--line);min-width:170px;z-index:60;box-shadow:0 16px 40px rgba(28,26,23,.12);padding:6px 0;letter-spacing:.04em}
.curm button{display:block;width:100%;text-align:left;padding:8px 16px;font-size:12.5px}.curm button:hover{background:var(--sand)}
header.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.hd>.wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:78px;gap:20px}
.logo{display:flex;flex-direction:column;line-height:1.1}
.logo b{font-family:var(--display);font-weight:500;letter-spacing:.32em;font-size:21px}
.logo span{font-size:9.5px;letter-spacing:.34em;color:var(--soft);margin-top:4px}
nav.mn{display:flex;gap:6px;height:78px}
.mi{display:flex;align-items:center;gap:4px;padding:0 16px;font-size:12.5px;letter-spacing:.2em;font-weight:600;position:relative;height:100%}
.mi .i{width:13px;height:13px;color:var(--soft);transition:transform .2s}
.mi::after{content:'';position:absolute;left:16px;right:16px;bottom:22px;height:1.5px;background:var(--ink);transform:scaleX(0);transition:transform .25s;transform-origin:left}
.mi:hover::after,.mi.cur::after{transform:scaleX(1)}
.mi.open .i{transform:rotate(180deg)}
.icons{display:flex;justify-content:flex-end;gap:20px;align-items:center}
.icons button{position:relative;display:flex}
.icons .i{width:21px;height:21px}
.badge{position:absolute;top:-7px;right:-9px;background:var(--ink);color:#fff;font-size:9.5px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.badge:empty{display:none}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 30px 50px rgba(28,26,23,.08);z-index:49}
.mega .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 300px;gap:34px;padding-block:32px 36px}
.mega .col h6{margin:0 0 14px;font-size:10.5px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.mega .col a{display:block;padding:5px 0;font-size:14px;color:#3b362f}
.mega .col a:hover{color:var(--gold)}
.mega .col.two{grid-column:span 2}.mega .col.two .ls{columns:2;column-gap:28px}
.mega .col a.hi{font-weight:700;color:var(--ink)}
.mph{background:var(--sand);padding:18px;display:flex;flex-direction:column;gap:10px}
.mph .pi{aspect-ratio:4/3;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden}
.mph .pi img{width:70%;transition:transform .4s}
.mph b{font-family:var(--display);font-weight:400;font-size:20px}
.mph small{color:var(--mute);font-size:12.5px}

/* page shell */
main{min-height:60vh}
.crumb{font-size:12.5px;color:var(--soft);display:flex;gap:8px;flex-wrap:wrap;padding-top:28px}
.crumb a:hover{color:var(--ink)}.crumb b{color:var(--ink);font-weight:500}
.sec{padding-block:72px}
.sech{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.tabs button{padding:0 0 10px;font-size:13px;letter-spacing:.12em;font-weight:600;color:var(--soft);border-bottom:1.5px solid transparent;margin-bottom:-1px;text-transform:uppercase}
.tabs button.on{color:var(--ink);border-color:var(--ink)}

/* hero */
.hero{position:relative;overflow:hidden;background:#EFE8DD}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;min-height:520px;padding-block:56px}
.hero .art{position:relative;height:440px;overflow:hidden}
.hero .tile{position:absolute;background:#F1F0EE;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 50px rgba(28,26,23,.14);max-width:60%}.hero .tile img{width:78%}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,5.2vw,68px);line-height:1.02;margin:12px 0 18px;text-wrap:balance}
.hsearch{display:flex;border:1px solid var(--line2);background:var(--paper);max-width:480px;margin-top:22px}
.hsearch input{flex:1;border:0;padding:15px 16px;background:transparent;min-width:0}
.hsearch input:focus{outline:none}
.hsearch button{padding:0 18px;border-left:1px solid var(--line)}
.trust{display:flex;justify-content:center;gap:34px;padding:16px 0;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;flex-wrap:wrap;background:var(--paper)}
.trust span{display:flex;gap:8px;align-items:center}.trust span::before{content:'';width:5px;height:5px;background:var(--gold2);transform:rotate(45deg)}

/* stone circles */
.circs{display:flex;gap:26px;flex-wrap:wrap}
.circ{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13.5px;width:110px;text-align:center}
.circ .c{width:104px;height:104px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .3s,box-shadow .3s}
.circ .c img{width:78%;transition:transform .5s}
.circ:hover .c{box-shadow:0 10px 24px rgba(28,26,23,.1)}.circ:hover .c img{transform:scale(1.1)}
.circ .c.sw2{border:0}

/* cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 22px}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{position:relative;background:var(--paper);border:1px solid #EFE9E0;display:flex;flex-direction:column;transition:box-shadow .3s}
.card:hover{box-shadow:0 18px 40px rgba(28,26,23,.08)}
.card .ph{position:relative;aspect-ratio:1/1;background:#F1F0EE;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card .ph img{width:62%;transition:transform .6s ease}
.card:hover .ph img{transform:scale(1.08)}
.card .tag{position:absolute;left:14px;top:14px;background:var(--paper);font-size:10px;letter-spacing:.16em;font-weight:700;padding:5px 8px;text-transform:uppercase}
.card .tag.one{background:var(--ink);color:#fff}
.heart{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;z-index:2}
.heart .i{width:16px;height:16px}.heart.on svg{fill:var(--warn);stroke:var(--warn)}
.qv{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(255,255,255,.95);text-align:center;padding:10px;font-size:11px;letter-spacing:.16em;font-weight:700;opacity:0;transform:translateY(8px);transition:all .25s}
.card:hover .qv{opacity:1;transform:none}
.card .cb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{font-family:var(--display);font-size:19px;line-height:1.25;cursor:pointer}
.card .dt{font-size:12.5px;color:var(--soft)}
.card .pr{margin-top:8px;font-size:15.5px;font-weight:700}.card .pr span{font-weight:400;color:var(--soft);font-size:12.5px}
.card .act{margin-top:auto;padding-top:14px;display:flex;gap:16px;align-items:center}

/* listing */
.lhead{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.nsbox{background:var(--paper);border:1px solid var(--line);padding:18px 20px;font-size:13px;margin-top:26px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:28px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--mute);flex-wrap:wrap}
.chosen{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chosen .x{background:#EFE8DD;border-radius:999px;padding:5px 10px 5px 12px;font-size:12px;color:#3b362f;display:inline-flex;align-items:center;gap:6px}
.chosen .x .i{width:12px;height:12px}
select.sort{border:0;background:transparent;font-weight:600;color:var(--ink);padding:4px}
.lmain{display:grid;grid-template-columns:260px minmax(0,1fr);gap:46px;padding-top:30px;align-items:start}
.side hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.side .cap{margin-bottom:12px;display:flex;justify-content:space-between}
.side .cap small{letter-spacing:0;text-transform:none;color:var(--soft);font-weight:400}
.tree a{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14.5px}
.tree a em{font-style:normal;color:var(--soft);font-size:12.5px}
.tree a.on{color:var(--gold);font-weight:700}
.tree .sub{padding-left:14px;border-left:1px solid var(--line);margin:2px 0 6px 2px}
.tree .sub a{font-size:13.5px;padding:5px 0 5px 10px;color:#4a443d}
.tree .sub a.on{border-left:2px solid var(--gold2);margin-left:-15px;padding-left:23px}
.tree .g{font-weight:500}
.range{width:100%;accent-color:var(--ink)}
.prr{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.more{text-align:center;padding:44px 0 10px;display:flex;flex-direction:column;align-items:center;gap:14px}
.prog{width:220px;height:2px;background:var(--line);position:relative}.prog i{position:absolute;left:0;top:0;height:2px;background:var(--ink)}
.empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--mute);background:var(--paper)}
.band{background:var(--sand);padding:36px 44px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;margin-top:70px}
.band h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 6px}
.band p{margin:0;color:var(--mute)}
.band .b{display:flex;gap:12px;flex-wrap:wrap}

/* product */
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:60px;padding-top:24px;align-items:start}
.views{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.views button{border:1px solid var(--line2);padding:7px 12px;font-size:12px;background:var(--paper)}
.views button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mainimg{aspect-ratio:1/1;background:#F1F0EE;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mainimg img{width:66%;transition:transform .5s,filter .4s}
.mainimg.loupe img{transform:scale(2.1)}
.mainimg.size{background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px}
.mainimg .play{position:absolute;left:16px;bottom:16px;background:rgba(28,26,23,.8);color:#fff;font-size:12px;padding:7px 12px;letter-spacing:.06em}
.mainimg.video img{animation:spin 6s linear infinite}
@keyframes spin{0%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}100%{transform:rotate(-8deg) scale(1)}}
.ruler{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--mute);background:var(--paper);padding:4px 10px;border:1px solid var(--line)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.thumbs button{aspect-ratio:1/1;background:#F1F0EE;border:1px solid transparent;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:70%}
.eye{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.pt{font-family:var(--display);font-weight:400;font-size:36px;line-height:1.15;margin:8px 0 6px}
.price{font-size:28px;font-weight:700;margin-top:16px}.price span{font-size:13.5px;color:var(--mute);font-weight:400}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-top:14px;background:var(--paper)}
.tiers div{padding:10px 14px;font-size:12.5px;color:var(--mute);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:background .2s}
.tiers div:last-child{border:0}.tiers b{color:var(--ink);font-size:15px}
.tiers div.on{background:var(--ink);color:#cfc6b8}.tiers div.on b{color:#fff}
.lbl{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.18em;font-weight:700;margin:22px 0 10px}
.lbl a{letter-spacing:0;font-weight:500;color:var(--gold);text-decoration:underline;font-size:12.5px}
.qty{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.step{display:flex;border:1px solid var(--line2);background:var(--paper)}
.step button{width:42px;height:44px;font-size:18px}
.step input{width:60px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);font-weight:700}
.step.s button{width:32px;height:34px}.step.s input{width:44px;font-size:13px}
.stock{font-size:12.5px;color:var(--ok);margin-top:10px}
.pbtns{display:grid;grid-template-columns:1fr 1fr 52px;gap:10px;margin-top:22px}
.pbtns .wl{border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;background:var(--paper)}
.pbtns .wl.on svg{fill:var(--warn);stroke:var(--warn)}
.tl{text-align:center;font-size:12.5px;color:var(--mute);margin-top:14px;display:flex;flex-direction:column;gap:6px}
.acc{border-top:1px solid var(--line);margin-top:26px}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px 0;cursor:pointer;font-size:14.5px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .i{width:14px;height:14px;color:var(--soft);transition:transform .2s}
.acc details[open] summary .i{transform:rotate(180deg)}
.acc .ab{padding:0 0 16px;color:var(--mute);font-size:13.5px}
.stonebox{background:var(--paper);border:1px solid var(--line);padding:22px 24px;margin-top:22px}
.sbh{display:flex;justify-content:space-between;align-items:baseline}
.sbh h4{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sbh span{font-size:11px;letter-spacing:.16em;color:var(--soft)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.keys div{background:var(--bg);padding:12px;display:flex;flex-direction:column}
.keys b{font-size:17px}.keys span{font-size:10px;letter-spacing:.14em;color:var(--soft)}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;font-size:13.5px}
.spec span{display:block;font-size:10px;letter-spacing:.14em;color:var(--soft)}
.make,.bulk{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 24px;margin-top:16px}
.make{background:var(--ink);color:#fff}.make p{color:#cfc6b8;margin:4px 0 0;font-size:13px}
.bulk{background:var(--sand);border:1px solid #E2D7C6}.bulk p{color:var(--mute);margin:4px 0 0;font-size:13px}
.make h4,.bulk h4{font-family:var(--display);font-weight:400;font-size:21px;margin:0}

/* drawer + modals */
.scrim{position:fixed;inset:0;background:rgba(28,26,23,.5);z-index:80;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);z-index:81;display:flex;flex-direction:column;animation:slide .3s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(100%)}}
.drh{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.drh b{font-family:var(--display);font-weight:400;font-size:22px}
.drb{flex:1;overflow:auto;padding:8px 24px}
.dri{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.dri .im{width:76px;height:76px;background:#F1F0EE;display:flex;align-items:center;justify-content:center}
.dri .im img{width:72%}
.dri .n{font-weight:600;font-size:13.5px;line-height:1.35}
.dri .m{font-size:12px;color:var(--soft);margin:3px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dri .m button{color:var(--gold);text-decoration:underline;font-size:12px}
.dri .note{font-size:11.5px;color:var(--ok);margin-top:6px}
.dri .r{text-align:right;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-weight:700}
.dri .r button{font-size:12px;color:var(--mute);text-decoration:underline;font-weight:400}
.sizes-inline{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.sizes-inline .chip{padding:3px 9px;font-size:11.5px}
.undo{background:var(--ink);color:#fff;display:flex;justify-content:space-between;padding:12px 16px;font-size:12.5px;margin:12px 0}
.undo button{text-decoration:underline;color:#fff}
.drf{border-top:1px solid var(--line);padding:18px 24px 22px}
.drf .st{display:flex;justify-content:space-between;font-size:16px;font-weight:700}
.drf small{display:block;color:var(--soft);margin:4px 0 14px;font-size:12px}
.drf .b2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:#FFFDF9;z-index:81;padding:34px 40px 30px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .25s ease}
.modal.sm{width:min(460px,calc(100% - 32px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}
.modal h3{font-family:var(--display);font-weight:400;font-size:32px;margin:0 0 4px;padding-right:30px}
.modal .sub{color:var(--mute);margin-bottom:20px}
.modal .x{position:absolute;right:22px;top:22px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fg .full{grid-column:1/-1}
.f label{display:block;font-size:10.5px;letter-spacing:.18em;font-weight:700;margin-bottom:6px;text-transform:uppercase}
.f input,.f select,.f textarea{width:100%;border:1px solid #D9CFC0;height:44px;padding:0 13px;background:var(--paper)}
.f textarea{height:80px;padding:10px 13px;resize:vertical}
.f small{display:block;color:var(--soft);font-size:11.5px;margin-top:5px}
.note{background:var(--sand);font-size:12.5px;padding:11px 14px;color:#4a443d}
.done{text-align:center;padding:20px 0}

/* checkout */
.coh{display:flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.14em;color:var(--soft);text-transform:uppercase;margin:24px 0 10px;flex-wrap:wrap}
.coh b{color:var(--ink)}
.co{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:48px;align-items:start;padding-bottom:40px}
.guest{background:var(--paper);border:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}

.cobox{background:var(--paper);border:1px solid var(--line);padding:22px 24px;margin-bottom:16px}

.rad{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line2);padding:13px 14px;margin-bottom:8px;cursor:pointer;background:var(--paper)}
.rad.on{border-color:var(--ink)}
.rad i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);flex:none;margin-top:2px;position:relative}
.rad.on i::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.rad span{display:block;font-size:12px;color:var(--soft)}
.rad .p{margin-left:auto;font-weight:700;white-space:nowrap}
.sum{background:var(--paper);border:1px solid var(--line);padding:22px 24px;position:sticky;top:100px}

.tbl{width:100%;border-collapse:collapse;background:var(--paper)}

.tbl td{padding:18px 16px;border-bottom:1px solid var(--line);vertical-align:middle}

/* layouts + jewelry art */
.lay{position:relative;width:100%;height:100%}
.gm{position:absolute;border-radius:50%;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.gm img{width:100%;height:100%;object-fit:cover;transform:scale(2.3)}

/* astrology */

/* track */
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:26px}

footer{background:#F1EBE1;margin-top:90px}

// ---------- art ----------
function layArt(l,s=1){
  const img=STIMG(LST[l.stone]||'ruby');let o='';
  if(l.kind==='line'){const n=15;for(let k=0;k<n;k++){const t=k/(n-1),a=Math.PI*(.15+.7*t),x=50-42*Math.cos(a),y=24+42*Math.sin(a),z=(16+22*Math.sin(Math.PI*t))*s;o+=`<div class="gm" style="left:calc(${x}% - ${z/2}px);top:calc(${y}% - ${z/2}px);width:${z}px;height:${z*.8}px">${img}</div>`}}
  else if(l.kind==='bracelet'){const n=18;for(let k=0;k<n;k++){const x=8+84*k/(n-1),y=50+6*Math.sin(Math.PI*k/(n-1));const z=20*s;o+=`<div class="gm" style="left:calc(${x}% - ${z/2}px);top:calc(${y}% - ${z/2}px);width:${z}px;height:${z*.85}px">${img}</div>`}}
  else if(l.kind==='pair'){for(const x of [33,67]){const z=88*s;o+=`<div class="gm" style="left:calc(${x}% - ${z/2}px);top:calc(50% - ${z*.4}px);width:${z}px;height:${z*.8}px">${img}</div>`}}
  else if(l.kind==='set'){for(const [x,z0] of [[24,54],[50,86],[76,54]]){const z=z0*s;o+=`<div class="gm" style="left:calc(${x}% - ${z/2}px);top:calc(50% - ${z*.4}px);width:${z}px;height:${z*.8}px">${img}</div>`}}
  return o;
}
function tennisArt(j,s=1,neck=false){const img=STIMG(j.stone==='other'?'spinel':j.stone);const metal=j.gold?'#D9B66F':'#D6D6D6';let o='';const n=neck?34:30;
  for(let k=0;k<n;k++){let x,y;if(neck){const t=k/(n-1),a=Math.PI*(.08+.84*t);x=50-40*Math.cos(a);y=16+52*Math.sin(a)}else{const a=2*Math.PI*k/n;x=50+36*Math.cos(a);y=50+25*Math.sin(a)}
   const z=(neck?15:18)*s;o+=`<div class="gm" style="left:calc(${x}% - ${z/2}px);top:calc(${y}% - ${z/2}px);width:${z}px;height:${z}px;border:${1.6*s}px solid ${metal}">${j.stone==='other'?STIMG(['ruby','sapphire','emerald','spinel','amethyst','topaz'][k%6]):img}</div>`}return o}
function strand(b,w=260){const n=w>100?26:12,R=w>100?110:24,cx=w/2,cy=w>100?20:6;let c='';for(let k=0;k<n;k++){const a=Math.PI*(.12+.76*k/(n-1));const x=cx-R*Math.cos(a),y=cy+R*.8*Math.sin(a);const r=w>100?(b.shape==='Chips'?6:b.shape==='Heishi'?4:b.shape==='Nugget'?8:b.shape==='Coin & cube'?7:6.5):2.6;
  c+=b.shape==='Heishi'||b.shape==='Coin & cube'?`<rect x="${x-r}" y="${y-r*.55}" width="${r*2}" height="${r*1.1}" rx="1.5" fill="${b.col}"/>`:`<ellipse cx="${x}" cy="${y}" rx="${r*(b.shape.includes('rondelle')||b.shape==='Rondelle'?1.2:1)}" ry="${r*(b.shape.includes('rondelle')||b.shape==='Rondelle'?.75:1)}" fill="${b.col}"/><ellipse cx="${x-r*.3}" cy="${y-r*.35}" rx="${r*.3}" ry="${r*.22}" fill="#fff" opacity=".45"/>`}
  const h=w>100?Math.round(w*.62):w;return `<svg viewBox="0 0 ${w} ${h}" width="${w>100?'82%':w}" style="max-width:100%"><path d="M${cx-R} ${cy} q0 -14 ${R} -16 q${R} 2 ${R} 16" stroke="#C9BFB1" fill="none" stroke-width="${w>100?1.2:.6}"/>${c}</svg>`}

function gemBase(arg){
 if(!arg||arg==='all'||arg==='new'||arg==='best'||arg==='birth')return {list:PRODUCTS,title:arg==='new'?'New this week':arg==='best'?'Best sellers':arg==='birth'?'Birthstones and gifts':'Gemstones',crumb:[['Gemstones','gems|all']],intro:'Natural loose gemstones, calibrated and matched by hand in Jaipur. Pick a stone, then the shape and size.'};
 if(arg==='precious')return {list:PRODUCTS.filter(p=>S[p.stone].group==='precious'),title:'Precious gemstones',crumb:[['Gemstones','gems|all'],['Precious','gems|precious']],intro:'Ruby, sapphire and emerald: calibrated lots, matched pairs and single stones.'};
 if(arg==='semi')return {list:PRODUCTS.filter(p=>S[p.stone].group==='semi'),title:'Semi-precious gemstones',crumb:[['Gemstones','gems|all'],['Semi-precious','gems|semi']],intro:'From amethyst to tanzanite, A to Z. Calibrated lots from 2 mm, singles and pairs.'};
 if(arg.startsWith('cut:')){const c=arg.slice(4);return {list:PRODUCTS.filter(p=>p.cut===c),title:c+' gemstones',crumb:[['Gemstones','gems|all'],[c,'']],intro:`Every ${c.toLowerCase()} stone we have, in all shapes and sizes.`}}
 if(arg.startsWith('colour:')){const c=arg.slice(7);return {list:PRODUCTS.filter(p=>p.colour===c),title:c+' gemstones',crumb:[['Gemstones','gems|all'],['Colour: '+c,'']],intro:`Natural ${c.toLowerCase()} stones, loose and calibrated.`}}
 if(arg.startsWith('shape:')){const c=arg.slice(6);return {list:PRODUCTS.filter(p=>p.shape===c),title:c+' gemstones',crumb:[['Gemstones','gems|all'],[c,'']],intro:`${c} stones in every cut.`}}
 if(arg.startsWith('price:'))return {list:PRODUCTS,title:'Gemstones under ₹100',crumb:[['Gemstones','gems|all'],['Under ₹100','']],intro:'Calibrated lots priced under ₹100 per piece.',preset:{price:'lt100'}};
 const s=S[arg];return {list:PRODUCTS.filter(p=>p.stone===arg),title:s.name,stone:s,crumb:[['Gemstones','gems|all'],[s.group==='precious'?'Precious':'Semi-precious',s.group==='precious'?'gems|precious':'gems|semi'],[s.name,'']],intro:`Natural ${s.name.toLowerCase()}, sorted by hand in Jaipur. Calibrated lots, singles and pairs in every cut we have.`};
}
const PRICEQ=[['lt100','Under ₹100',p=>p.price<100],['mid','₹100–1,000',p=>p.price>=100&&p.price<=1000],['gt1000','₹1,000+',p=>p.price>1000]];
function applyF(list,f,skip){return list.filter(p=>(skip==='cut'||!f.cut||p.cut===f.cut)&&(skip==='shape'||!f.shape||p.shape===f.shape)&&(skip==='size'||!f.size||p.sizes.includes(f.size))&&(skip==='soldAs'||!f.soldAs||p.soldAs===f.soldAs)&&(skip==='colour'||!f.colour||p.colour===f.colour)&&(skip==='quality'||!f.quality||p.quality===f.quality)&&(skip==='treat'||!f.treat||p.treat===f.treat)&&(skip==='price'||!f.price||PRICEQ.find(q=>q[0]===f.price)[2](p))&&(f.max==null||p.price<=f.max))}
function counts(list,f,key,get){const m=new Map();applyF(list,f,key).forEach(p=>[].concat(get(p)).forEach(v=>m.set(v,(m.get(v)||0)+1)));return m}
const SORTS={newest:['Newest',(a,b)=>a.newRank-b.newRank],best:['Best selling',(a,b)=>b.sold-a.sold],plh:['Price low to high',(a,b)=>a.price-b.price],phl:['Price high to low',(a,b)=>b.price-a.price],size:['Size',(a,b)=>parseFloat(a.sizes[0])-parseFloat(b.sizes[0])]};
function fchips(key,m,order){const f=st.f;const keys=order?order.filter(k=>m.has(k)):[...m.keys()];return `<div class="chips">${keys.map(k=>`<button class="chip ${f[key]===k?'on':''}" data-a="f" data-k="${key}" data-v="${k}">${key==='colour'?`<span class="sw" style="background:${(COLOURS.find(c=>c[0]===k)||[0,'#ccc'])[1]}"></span>`:''}${k}<em>${m.get(k)}</em></button>`).join('')}</div>`}
function gems(){
 const b=gemBase(st.arg),f=st.f;if(b.preset&&!f._p){Object.assign(f,b.preset);f._p=1}

  <hr><div class="cap"><span>Price per piece</span></div><input type="range" class="range" id="pmax" min="0" max="${maxP}" step="10" value="${f.max??maxP}" data-a="max" aria-label="Highest price"><div class="prr"><span>${money(0)}</span><span>up to ${money(f.max??maxP)}</span></div>
  <div class="chips" style="margin-top:12px">${PRICEQ.filter(q=>pM.has(q[1])||f.price===q[0]).map(q=>`<button class="chip ${f.price===q[0]?'on':''}" data-a="f" data-k="price" data-v="${q[0]}">${q[1]}<em>${pM.get(q[1])||0}</em></button>`).join('')}</div></aside>`;
 const top=s?`<div class="chips" style="margin-top:24px"><button class="chip lg ${!f.cut?'on':''}" data-a="f" data-k="cut" data-v="">All<em>${b.list.length}</em></button>${['Faceted','Cabochon','Rose cut'].filter(c=>cutM.has(c)).map(c=>`<button class="chip lg ${f.cut===c?'on':''}" data-a="f" data-k="cut" data-v="${c}">${c}<em>${cutM.get(c)}</em></button>`).join('')}</div>`
   :`<div class="circs" style="margin-top:28px">${(st.arg==='precious'?['ruby','sapphire','emerald']:st.arg==='semi'?STONES.filter(x=>x.group==='semi').map(x=>x.id).slice(0,9):['ruby','sapphire','emerald','rainbow-moonstone','topaz','amethyst','garnet','peridot','spinel']).map(id=>`<a class="circ" data-go="gems|${id}"><span class="c">${STIMG(id)}</span>${S[id].name}</a>`).join('')}</div>`;
 return `<div class="wrap"><div class="crumb"><a data-go="home">Home</a>${b.crumb.map(([t,g],i)=>` › ${i===b.crumb.length-1?`<b>${t}</b>`:`<a data-go="${g}">${t}</a>`}`).join('')}</div>
 <div class="lhead"><div><h1 class="h1">${b.title}</h1><p class="lead">${b.intro}</p></div>${s?`<div class="nsbox"><span class="cap">New stock first</span><div style="margin-top:6px"><a class="link" data-go="guide">Stone guide →</a> · <a class="link" data-a="wa">New ${s.name} on WhatsApp →</a></div></div>`:''}</div>${top}

}

 if(o==='bq'){const b=BEADS.find(x=>x.id===v);return `${scrim}<div class="modal" role="dialog" aria-label="${beadName(b)}">${x}<div style="background:#F6F4F0;display:flex;justify-content:center;padding:20px">${strand(b)}</div><h3 style="font-size:26px;margin-top:16px">${beadName(b)}</h3><p class="sub">${b.n} · hole ${b.hole} mm · ${b.q}</p><div class="price" style="margin:0">${money(b.price)} <span>${b.sold==='Strand'?'per strand':'per bead'}</span></div>

function renderOv(){$('#ov').innerHTML=overlay();const i=$('#sq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
function go(r,a=''){closeMega();if(r==='astro'&&a!==''){if(/^\d+$/.test(a))st.planet=+a;else st.anchor=a;a=''}
 if(r!==st.route||a!==st.arg){if(r==='gems'||r==='layouts'||r==='jewelry'||r==='beads'){if(r==='gems')st.f={};if(r==='layouts')st.lay={};if(r==='jewelry')st.jw={};if(r==='beads')st.bd={};st.shown=6}}

document.addEventListener('click',e=>{
 const a=e.target.closest('[data-a]'),g=e.target.closest('[data-go]');

 if(!e.target.closest('.demo')&&$('#demom'))$('#demom').hidden=true;
 const skip=a&&(a.tagName==='FORM'||['sq','max','sort','country','pqin','cqin'].includes(a.dataset.a));
 if(a&&!skip){const fn=ACT[a.dataset.a];if(fn){e.preventDefault();fn(a.dataset.v,a)}}
 if(g&&(!a||skip||a===g||!g.contains(a))){e.preventDefault();const[r,x]=g.dataset.go.split('|');go(r,x||'')}
});

 else if(k==='csend'){st.csent=true;render()}

});

 <span class="cap" style="display:block;margin-top:20px">Our story</span><h2 class="h2">A Jaipur family in gemstones for over thirty years.</h2><p style="color:var(--mute)">Vivaaz Gems began in 2018, built on a family trade in coloured stones that goes back more than three decades. We sort, calibrate and match every lot by hand in Jaipur.</p><button class="btn o" data-go="story">Read our story</button></section>
 <section style="background:var(--paper)"><div class="wrap" style="padding-block:34px"><span class="cap">@vivaazgems</span><h2 class="h2">Seen on Instagram.</h2><p style="color:var(--mute);margin:6px 0 16px">Tap a reel to shop the exact stone in it.</p>
 <div class="swipe rswipe">${REELS.map(reelCard).join('')}</div><div class="rlinks"><a class="ul" data-go="reels">All reels →</a><a class="ul" data-a="soc">Follow us →</a></div></div></section>
 <section class="wrap" style="padding-block:34px"><span class="cap">Google reviews</span><h2 class="h2" style="margin-bottom:16px">What buyers say.</h2>
 <div class="swipe" id="revs">${REVIEWS.map(([n,c,t2])=>`<div style="width:calc(100% - 4px);background:var(--paper);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:10px"><span style="color:var(--gold2);letter-spacing:3px">★★★★★</span><p style="margin:0">${t2}</p><span style="font-size:12.5px;color:var(--soft)">${n} · ${c}</span></div>`).join('')}</div><div class="dots" id="rdots">${REVIEWS.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>
 <div class="askbox" style="margin-top:20px"><span class="cap">Talk to a gem expert</span><b>Not sure what to choose? Ask us.</b><p>We send live photos and videos of the exact stones, and help with sizes, matching and certificates.</p><button class="btn wa" data-a="wa">${ico('wa')} WhatsApp</button><button class="btn o" data-a="videocall">Book a video call</button></div></section>`}
document.addEventListener('scroll',e=>{const r=e.target.id==='revs'?e.target:null;if(!r)return;const i=Math.round(r.scrollLeft/(r.clientWidth));document.querySelectorAll('#rdots i').forEach((d,k)=>d.classList.toggle('on',k===i))},true);
// pieces change must refresh the buy bar
// guide panel next to the phone
const PG=[['Shop',[['Homepage','home'],['Menu: tap Gemstones, then Precious','@menu'],['Stone page: Filter · Sort line','gems|rainbow-moonstone'],['Filter panel from the bottom','@filter'],['Product page','product|rmcoc68'],['Single stone (Only 1)','product|bsf1'],['Layouts','layouts|all'],['Jewelry','jewelry|all'],['Jewelry design page','design|j1'],['Beads','beads|all'],['Astrology','astro']]],
 ['Buying',[['Bag panel','@cart'],['Bag page','bag'],['Checkout (try another country)','checkout'],['Track order','track'],['Wishlist','wish']]],
 ['Pop-ups',[['Search with reel codes','@search'],['Sign in with WhatsApp code','@account'],['Book a consultation','@consult'],['Get my price','@getprice']]],
 ['Instagram journey',[['Open a product from a reel','@reel'],['Reels page (Instagram bio link)','reels']]],['Style guide',[['Buttons, icons, drop-downs, spacing','style']]]];
ACT.pgo=v=>{if(v.startsWith('@')){const k=v.slice(1);if(k==='filter'){if(st.route!=='gems')go('gems','rainbow-moonstone');open('filter');return}if(k==='reel'){ACT.reel('rmcoc68');return}if(k==='cart'&&!st.cart.length)addCart('rmcoc68','6×8',12);if(k==='getprice'){open('quote','Ruby Tennis Bracelet');return}ACT[k]();return}const[r,x]=v.split('|');go(r,x||'')};


document.querySelector('.guide').innerHTML=`<span class="cap">Vivaaz Gems · phone</span><h1>The website on a phone</h1><p>Reference for the Flatsome build: how the phone site should look and work. Everything here is from the Build Book. Scroll and tap inside the phone, or jump to a screen:</p>${PG.map(([h,l])=>`<h6>${h.toUpperCase()}</h6>${l.map(([t,r])=>`<button data-a="pgo" data-v="${r}">${t}</button>`).join('')}`).join('')}<p style="font-size:12.5px;margin-top:16px">Photos, prices and names are examples.</p>`;
document.getElementById('shell').innerHTML=header()+'<main id="app"></main>'+footer()+'<div id="bbar"></div>';
render();
