<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vivaaz Gems & Jewellery · Complete Interactive Experience</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #FAF7F2; font-family: 'Manrope', -apple-system, sans-serif; }
    #demo-frame { width: 100%; height: 100%; border: none; display: block; }
    
    /* Floating Switcher Pill */
    .view-switcher-pill {
      position: fixed;
      top: 10px;
      right: 18px;
      z-index: 999999;
      display: flex;
      background: #1C1A17;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      transition: opacity 0.25s, transform 0.25s;
    }
    .view-switcher-pill:hover {
      opacity: 1;
      transform: translateY(0);
    }
    .view-switcher-btn {
      background: transparent;
      border: none;
      color: #D5CEC4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .view-switcher-btn.active {
      background: #FAF7F2;
      color: #1C1A17;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .view-switcher-btn:hover:not(.active) {
      color: #FFFFFF;
    }
    
    @media (max-width: 600px) {
      .view-switcher-pill {
        top: auto;
        bottom: 12px;
        right: 12px;
        left: 12px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Switcher -->
  <div class="view-switcher-pill" id="switcher">
    <button type="button" class="view-switcher-btn active" id="btn-desktop" onclick="setView('desktop')">
      <span>🖥️</span> Desktop Demo
    </button>
    <button type="button" class="view-switcher-btn" id="btn-phone" onclick="setView('phone')">
      <span>📱</span> Phone Demo
    </button>
  </div>

  <!-- Primary Interactive View Frame -->
  <iframe id="demo-frame" src="Vivaaz-Website-Desktop-Demo.html" title="Vivaaz Gems Demo"></iframe>

  <script>
    function setView(mode) {
      const frame = document.getElementById('demo-frame');
      const btnDesktop = document.getElementById('btn-desktop');
      const btnPhone = document.getElementById('btn-phone');
      
      if (mode === 'desktop') {
        frame.src = 'Vivaaz-Website-Desktop-Demo.html';
        btnDesktop.classList.add('active');
        btnPhone.classList.remove('active');
        localStorage.setItem('vivaaz_demo_pref', 'desktop');
      } else {
        frame.src = 'Vivaaz-Website-Phone-Demo.html';
        btnPhone.classList.add('active');
        btnDesktop.classList.remove('active');
        localStorage.setItem('vivaaz_demo_pref', 'phone');
      }
    }

    // Auto-detect based on screen width or previous preference
    (function init() {
      const saved = localStorage.getItem('vivaaz_demo_pref');
      if (saved === 'phone' || (!saved && window.innerWidth < 768)) {
        setView('phone');
      } else {
        setView('desktop');
      }
    })();
  </script>
</body>
</html>
